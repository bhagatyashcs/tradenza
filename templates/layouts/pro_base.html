<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tradenza Pro{% endblock %}</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-base: #030712; /* Deepest zinc/blue */
            --bg-panel: rgba(17, 24, 39, 0.7); /* Translucent */
            --bg-panel-hover: rgba(31, 41, 55, 0.8);
            --border: rgba(55, 65, 81, 0.5);
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.3);
            --red: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.3);
            --accent: #06b6d4; /* Neon cyan */
            --accent-glow: rgba(6, 182, 212, 0.4);
            --purple: #8b5cf6;
            --purple-glow: rgba(139, 92, 246, 0.4);
            
            --font-main: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(6, 182, 212, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.05), transparent 25%);
            color: var(--text-primary);
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-size: 13px;
        }

        /* Top Navigation Bar */
        .pro-topbar {
            height: 60px;
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
            z-index: 100;
        }

        .pro-topbar-left {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .pro-logo {
            font-size: 1.35rem;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 15px var(--accent-glow);
        }
        
        .pro-logo i {
            color: var(--accent);
        }

        .pro-nav-links {
            display: flex;
            gap: 16px;
        }

        .pro-nav-link {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: color 0.2s;
        }

        .pro-nav-link:hover {
            color: var(--accent);
        }

        .pro-topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .pro-status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--green);
            background: rgba(14, 203, 129, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(14, 203, 129, 0.2);
        }

        /* Main Workspace Container */
        .pro-workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 56px);
            overflow: hidden;
        }

        /* Scrollbar customization */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* Buttons & Inputs */
        .pro-btn {
            background: var(--bg-panel-hover);
            color: var(--text-primary);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 13px;
        }
        .pro-btn:hover {
            background: #3b424d;
        }
        .pro-btn-green { background: var(--green); color: #000; }
        .pro-btn-green:hover { background: #0b9e65; }
        .pro-btn-red { background: var(--red); color: #fff; }
        .pro-btn-red:hover { background: #c93649; }

        .pro-input {
            background: var(--bg-base);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 4px;
            width: 100%;
            font-family: var(--font-mono);
            font-size: 13px;
            outline: none;
        }
        .pro-input:focus {
            border-color: var(--accent);
        }

        /* Utility classes */
        .text-green { color: var(--green) !important; }
        .text-red { color: var(--red) !important; }
        .font-mono { font-family: var(--font-mono) !important; }
        .text-muted { color: var(--text-secondary) !important; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>

    <header class="pro-topbar">
        <div class="pro-topbar-left">
            <a href="{{ url_for('market.pro_terminal') }}" class="pro-logo">
                <i data-lucide="activity"></i>
                Tradenza Pro
            </a>
            <nav class="pro-nav-links">
                <a href="{{ url_for('market.pro_terminal') }}" class="pro-nav-link" style="color: var(--accent);">Markets</a>
                <a href="{{ url_for('trade.new_trade') }}" class="pro-nav-link">Execution</a>
                <a href="{{ url_for('dashboard.dashboard') }}" class="pro-nav-link">Analytics</a>
            </nav>
        </div>
        <div class="pro-topbar-right">
            <div class="pro-status-indicator">
                <span style="width: 6px; height: 6px; background: var(--green); border-radius: 50%; box-shadow: 0 0 6px var(--green);"></span>
                SYS_ONLINE
            </div>
            <div style="font-family: var(--font-mono); color: var(--text-primary); font-size: 14px; display: flex; gap: 16px;">
                <span>BAL: <strong style="color: var(--text-primary);">$100,000.00</strong></span>
            </div>
            <a href="{{ url_for('auth.logout') }}" style="color: var(--text-secondary); text-decoration: none;">
                <i data-lucide="log-out" style="width: 18px; height: 18px;"></i>
            </a>
        </div>
    </header>

    <main class="pro-workspace">
        {% block content %}{% endblock %}
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
